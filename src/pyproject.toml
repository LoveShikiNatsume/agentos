[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS Runtime: OS-level multi-agent execution runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
app = ["aiohttp>=3.9,<4", "python-dotenv>=1.0"]
langgraph = ["langgraph==1.2.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "imageio-ffmpeg>=0.6,<1",
]
cloud-bench = [
    "langgraph==1.2.8",
    "langchain-openai==1.3.5",
    "autogen-agentchat==0.7.5",
    "autogen-core==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "crewai==1.15.2",
    "openai-agents==0.18.0",
]

[project.scripts]
agentctl = "agentos.cli:main"

[tool.setuptools.packages.find]
include = ["agentos*"]

[tool.setuptools.package-data]
"agentos.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]
"agentos.workbench" = ["static/*.html", "static/*.css", "static/*.js"]
"agentos.scenarios.sched_ext_business" = ["fixture_*_manifest.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
